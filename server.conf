[server]
# Number of recent chat turns to keep in context for each new conversation
latest_chat_limit = 20

[agent]
# Maximum number of tool calls allowed per model turn (one tool_calls batch).
# After each batch completes the counter resets, so the model can call tools
# again in the next turn without hitting the cumulative ceiling.
max_tool_calls = 25

# Maximum number of SKILL.md reads allowed per model turn.
max_skill_reads = 25

[replies]
# Reply sent to the user right after a file is received, asking for next-step instructions.
file_received = 收到，请问下一步怎么处理？
# Acknowledgement sent once before the first tool-call batch executes.
tool_ack = 好的，我开始工作了

[jobs]
# Maximum number of concurrent subprocess (shell) jobs.
max_concurrent = 3
# How often (in seconds) to send a WeChat job status report (3 minutes = 180).
check_interval_seconds = 180
