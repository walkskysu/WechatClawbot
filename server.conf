[server]
# Number of recent chat turns to keep in context for each new conversation
latest_chat_limit = 20

[agent]
# Maximum number of tool calls allowed per model turn (one tool_calls batch).
# After each batch completes the counter resets, so the model can call tools
# again in the next turn without hitting the cumulative ceiling.
max_tool_calls = 25

# Maximum number of SKILL.md reads allowed per model turn.
max_skill_reads = 25
